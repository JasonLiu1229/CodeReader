[project]
name = "codereader"
version = "0.1.0"
description = ""
authors = [
    {name = "Jason Liu",email = "Liujason2003@gmail.com"}
]
readme = "README.md"
packages = [{ include = "CodeReader", from = "src" }]
requires-python = ">=3.12"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "typer (>=0.21.1,<0.22.0)",
    "rich (>=14.2.0,<15.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "anyio (>=4.12.1,<5.0.0)",
    "orjson (>=3.11.5,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.11"
mypy = "^1.19.1"
pytest = "^9.0.2"

[tool.poetry.scripts]
CodeReader = "CodeReader.cli:app"

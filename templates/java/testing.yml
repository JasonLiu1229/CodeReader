language: java

tags:
  - testing
  - unit tests

settings:
  timeout_seconds: 120
  health_timeout_seconds: 900
  max_concurrency: 1
  fail_on_no_active_models: true
  log_path: readability_log.txt
  debug_jsonl_path: responses.jsonl

models:
  - name: Qwen2.5-coder
    model: qwen2.5-coder
    runner: ollama
    runner_config:
      ollama_bin: ollama
    weight: 1.0
    enable: true

  - name: Deepseek
    model: deepSeek-coder:6.7b
    runner: ollama
    runner_config:
      ollama_bin: ollama
    weight: 1
    enable: true

  - name: CodeLlamma
    model: codellama
    runner: ollama
    runner_config:
      ollama_bin: ollama
    weight: 0.5
    enable: true
